experiment:
  name: deterministic
  run_name: det_obs15_area_augmented

seed: 42

pie_data:
  behaviour_cache_directory: data/cache/PIE_behaviour/obs15
  processed_cache_directory: data/cache/PIE_processed/obs15/flip_only

model_opts:
  obs_length: 16
  balance_data: true
  balance_strategy: flip_only

data_opts:
  min_track_size: 76

feature_opts:
  use_center: true
  use_area: true
  use_aspect_ratio: false

net_opts:
  input_dimension: 8

uncertainty_opts:
  enabled: false

checkpoint:
  directory: checkpoints/example_deterministic
  filename: "det-{epoch:03d}-{val_best_threshold_f1:.4f}"
